name: Send Draw Day Reminders
on:
  schedule:
    # Oz Lotto Reminder: Monday 9:00 AM Sydney (Tuesday Draw)
    - cron: '0 23 * * 1' # Monday at 11:00 PM UTC (9:00 AM Sydney on Tuesday if AEDT)
    # Powerball Reminder: Wednesday 9:00 AM Sydney (Thursday Draw)
    - cron: '0 23 * * 3' # Wednesday at 11:00 PM UTC (9:00 AM Sydney on Thursday if AEDT)
    # Tatts Lotto Reminder: Friday 9:00 AM Sydney (Saturday Draw)
    - cron: '0 23 * * 5' # Friday at 11:00 PM UTC (9:00 AM Sydney on Saturday if AEDT)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run Reminder
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npx tsx scripts/remind-draw.ts