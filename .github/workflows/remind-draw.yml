name: Send Draw Day Reminders
on:
  schedule:
    # 10:00 PM UTC Sun/Tue is 9:00 AM Mon/Wed Sydney time (AEDT)
    # 0 = Sunday (Remind Mon for Tue Oz Lotto), 2 = Tuesday (Remind Wed for Thu Powerball)
    - cron: '0 8 * * *' #'0 22 * * 0,2'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run Reminder
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run remind-draw
