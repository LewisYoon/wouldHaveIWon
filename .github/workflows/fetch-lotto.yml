name: Fetch Latest Lotto Results
on:
  schedule:
    # 11:00 UTC is 10:00 PM Sydney time (AEDT)
    # 2 = Tuesday (Oz Lotto), 4 = Thursday (Powerball) 6 = Saturday (tatts)
    - cron: '0 11 * * 2,4,6'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run Fetcher
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npx tsx scripts/fetch-lotto.ts
